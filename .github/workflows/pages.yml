# Publish the app to GitHub Pages so the app works on your phone.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# Then run this from the Actions tab ("Run workflow") whenever you want
# the site updated.
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Keep only what the app serves
        run: |
          mkdir site
          cp -r index.html css js data icon.svg manifest.webmanifest sw.js site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
